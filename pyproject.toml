[project]
name = "harness-engineer-agent"
version = "0.1.0"
description = "Durable runtime for resumable, observable agent runs"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.8,<4.9",
    "celery[redis]>=5.4,<6.0",
    "fastapi>=0.115,<0.116",
    "pydantic>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=8,<9",
]
